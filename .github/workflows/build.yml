name: Build and release APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: Why this update exists (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/naviplayer.keystore"

      - name: Build signed APK
        env:
          NAVIPLAYER_KEYSTORE_PATH: ${{ runner.temp }}/naviplayer.keystore
          NAVIPLAYER_KEYSTORE_PASSWORD: ${{ secrets.NAVIPLAYER_KEYSTORE_PASSWORD }}
          NAVIPLAYER_KEY_ALIAS: ${{ secrets.NAVIPLAYER_KEY_ALIAS }}
          NAVIPLAYER_KEY_PASSWORD: ${{ secrets.NAVIPLAYER_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          VERSION="2.1.${GITHUB_RUN_NUMBER}"
          APK="NaviPlayer-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaviPlayer-${{ env.VERSION }}
          path: ${{ env.APK }}

      - name: Write release notes
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "## Why this update"
            echo
            if [ -n "$MANUAL_NOTES" ]; then
              echo "$MANUAL_NOTES"
            elif [ -n "$PREVIOUS_TAG" ]; then
              git log --format='- %s' "${PREVIOUS_TAG}..HEAD"
            else
              echo "- Public launch of the standalone NaviPlayer Android client."
              echo "- Refreshed sign-in, app identity and adaptive launcher icon."
              echo "- Persistent local profile avatar and polished now-playing controls."
            fi
            echo
            echo "## Build"
            echo
            echo "Version ${VERSION} · commit ${GITHUB_SHA:0:7}"
          } > release-notes.md

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" \
              --title "NaviPlayer ${VERSION}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
